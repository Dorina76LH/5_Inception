services:

# ---------------------------------------------------------
# NGINX
# ---------------------------------------------------------
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    env_file:
      - .env

