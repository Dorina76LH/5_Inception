services:

#? ---------------------------------------------------------
#? MARIADB
#? ---------------------------------------------------------

  mariadb:
    container_name: inception-mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:1.0
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    secrets:
      - db_password
      - db_root_password

#? ---------------------------------------------------------
#? WORDPRESS - depends on mariadb
#? ---------------------------------------------------------

  wordpress:
    container_name: inception-wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:1.0
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    restart: unless-stopped

#? ---------------------------------------------------------
#? NGINX - depends on wordpress
#? ---------------------------------------------------------
  nginx:
    container_name: inception-nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:1.0
    env_file:
      - .env
    depends_on:
      - wordpress
      - adminer
      - static-website
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    restart: unless-stopped

# ---------------------------------------------------------
# MARIA DB ADMINER (Bonus) - depends on mariadb
# ---------------------------------------------------------
  adminer:
    container_name: inception-adminer
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer:1.0
    env_file:
      - .env
    depends_on:
      - mariadb
    networks:
      - inception_network
    restart: unless-stopped

# ---------------------------------------------------------
# STATIC WEBSITE (Bonus)
# ---------------------------------------------------------
  static-website:
    container_name: inception-static-website
    build:
      context: ./requirements/bonus/static_website
      dockerfile: Dockerfile
    image: static-website:1.0
    networks:
      - inception_network
    restart: unless-stopped

# ---------------------------------------------------------
# NETWORKS
# ---------------------------------------------------------

networks:
  inception_network:
    driver: bridge

# ---------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/doberes/data/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/doberes/data/mariadb

# ---------------------------------------------------------
# SECRETS
# ---------------------------------------------------------

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt