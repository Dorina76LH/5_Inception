server {
    
    # SSL/TLS configuration
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # server_name / root directory / index files
    server_name doberes.42.fr;
    root /var/www/html;
    index index.php index.html index.htm;

    # Static file handling
    # for every request, try to serve the file directly, if not found, return a 404 error
    location / {
        try_files $uri $uri/ =404;
    }

    # Adminer location
    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static website location
    location = /cv/ {
        return 301 /cv/cv.pdf;
    }
    location /cv/ {
        proxy_pass http://static-website:5000/; 
        proxy_set_header Host $host;
    }

    #PHP processing
    #for requests ending with .php, pass the request to the FastCGI server (WordPress container) for processing
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
    }
}